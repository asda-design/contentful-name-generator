<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contentful Name Generator</title>

<style>
@font-face {
font-family: 'ASDAText-Regular';
src: url('/fonts/ASDAText-Regular.otf') format('opentype');
}

@font-face {
    font-family: 'ASDADisplay-Headline';
    src: url('/fonts/ASDADisplay-Headline.otf') format('opentype');
}

body {
    max-width: 1000px;
    margin: 40px auto;
    background: #002E3D;
    font-family: ASDAText-Regular;
}

h1,
h2 {
    margin-bottom: 20px;
    font-family: ASDADisplay-Headline;
    color: #fff;
    text-align: center;
}

.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 4px;
}

input,
select,
textarea {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
}

textarea {
    resize: none;
}

button {
    padding: 10px 16px;
    cursor: pointer;
    font-family: ASDAText-Regular;
}

input,select, textarea {
    font-family: ASDAText-Regular;
    border: none;
    border-radius: 6px;
}

.error {
    color: #d32f2f;
    margin-top: 12px;
    font-weight: bold;
}

.success {
    color: green;
    margin-top: 12px;
    font-weight: bold;
}

.history-date {
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
}

.history-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

.history-row input {
    flex: 1;
}

.actions {
    margin-top: 10px;
}

.history-item {
    border: 1px solid #ddd;
    border-radius: 4px;
    margin-bottom: 10px;
}

.history-date {
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
}

.history-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

.history-row input {
    flex: 1;
}

.delete-btn {
    background: #E0004D;
    color: white;
    border: none;
    border-radius: 6px;
}

.delete-all-btn {
    background: none;
    border: 3px solid #002E3B;
    color: #E0004D;
    font-weight: bold;
    text-decoration: underline;
    border-radius: 6px;
    margin-top: 15px;
}

.generate-btn, .copy-btn, .copy-btn-history {
    background: #002E3B;
    color: white;
    border: none;
    border-radius: 6px;
}

.delete-btn:hover {
    background: #b71c1c;
}
.scalloped-border {
    position: relative;
    background: #CCE8DC;
    padding: 40px;
    display: block;
    width: 90%;
    margin: 10px auto 80px;
}

.corner {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #002E3D;
}

.corner-tl {
    top: -10px;
    left: -10px;
}

.corner-tr {
    top: -10px;
    right: -10px;
}

.corner-bl {
    bottom: -10px;
    left: -10px;
}

.corner-br {
    bottom: -10px;
    right: -10px;
}

.page-title-header {
    display: block;
    margin: 0 auto;
    position: relative;
    left: 90px;
    transform: rotate(4deg);
    animation: pop-in-bounce-title 0.5s ease-out;
}

.generate-title {
    position: absolute;
    z-index: 1;
    transform: rotate(-4deg);
    top: -36px;
    left: 30px;
    animation: pop-in-bounce-generate 0.5s ease-out;
    animation-delay: .140s;
}

.history-title {
    position: absolute;
    z-index: 1;
    transform: rotate(4deg);
    top: -40px;
    left: 40px;
    animation: pop-in-bounce-history 0.5s ease-out;
    animation-delay: .300s;
}

.page-header {
    margin-bottom: 40px;
}

select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;

    padding-right: 40px;
}

.select-wrapper {
    position: relative;
}

.select-wrapper::after {
    content: "";
    position: absolute;
    right: 12px;
    top: 50%;
    width: 6px;
    height: 6px;
    border-right: 3px solid #000;
    border-bottom: 3px solid #000;
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
}

@keyframes pop-in-bounce-title {
  0%   { opacity: 0; transform: rotate(4deg) scale(0.1); }
  60%  { opacity: 1; transform: rotate(4deg) scale(1.1); }
  100% { transform: rotate(4deg) scale(1); }
}

@keyframes pop-in-bounce-generate {
  0%   { opacity: 0; transform: rotate(-4deg) scale(0.1); }
  60%  { opacity: 1; transform: rotate(-4deg) scale(1.1); }
  100% { transform: rotate(-4deg) scale(1); }
}

@keyframes pop-in-bounce-history {
  0%   { opacity: 0; transform: rotate(4deg) scale(0.1); }
  60%  { opacity: 1; transform: rotate(4deg) scale(1.1); }
  100% { transform: rotate(4deg) scale(1); }
}

</style>
</head>

<script>

const liveDateInput = document.getElementById("liveDate");

liveDateInput.addEventListener("change", () => {
    document.getElementById("weekNumber").value =
        getISOWeekNumber(liveDateInput.value);
});

// Calculates the week number based on the date input selctor
function getISOWeekNumber(dateString) {

    const date = new Date(dateString);

    const target = new Date(
        Date.UTC(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        )
    );

    const dayNum = target.getUTCDay() || 7;

    target.setUTCDate(
        target.getUTCDate() + 4 - dayNum
    );

    const yearStart = new Date(
        Date.UTC(target.getUTCFullYear(), 0, 1)
    );

    return Math.ceil(
        (((target - yearStart) / 86400000) + 1) / 7
    );
}

// Replaces values or spaces with "_" for no user input formatting
function cleanText(value) {

    return value
        .trim()
        .replace(/[^\w\s]/g, "_")
        .replace(/\s+/g, "_")
        .replace(/_+/g, "_")
        .replace(/^_|_$/g, "");
}

// Gets the date slection and converts from browser format to the format we use "DDMMYY"
function formatDate(dateValue) {

    const date = new Date(dateValue);

    const year =
        String(date.getFullYear()).slice(-2);

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(date.getDate())
            .padStart(2, "0");

    return `${year}${month}${day}`;
}

// Generates the string of user inputted info
function generateName() {

    const liveDateRaw =
        document.getElementById("liveDate").value;

    const team =
        cleanText(
            document.getElementById("team").value
        );

    const component =
        cleanText(
            document.getElementById("componentType").value
        );

    const campaign =
        cleanText(
            document.getElementById("campaignName").value
        );

    const week =
        document.getElementById("weekNumber")
            .value
            .trim();

    const booking =
        cleanText(
            document.getElementById("bookingId").value
        );

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    error.textContent = "";
    success.textContent = "";

    if (
        !liveDateRaw ||
        !team ||
        !component ||
        !campaign ||
        !week ||
        !booking
    ) {
        error.textContent =
            "All fields must be completed.";
        return;
    }

    const formattedDate =
        formatDate(liveDateRaw);

    const output =
        `${formattedDate}_${team}_${component}_${campaign}_W${week}_${booking}`;

    document.getElementById("output").value =
        output;

    saveToHistory(output);

    success.textContent =
        "Naming convention generated successfully.";
}

// Copies the generated string to the user clipboard
function copyToClipboard() {

    const text =
        document.getElementById("output").value;

    if (!text) return;

    navigator.clipboard.writeText(text);

    document.getElementById("success").textContent =
        "Copied to clipboard.";
}

// Stores any generated strings to the users local storage
function saveToHistory(name) {

    let history =
        JSON.parse(
            localStorage.getItem("nameHistory")
        ) || [];

    history =
        history.filter(
            item => item.name !== name
        );

    history.unshift({
    id: crypto.randomUUID(),
    name: name,
    timestamp: new Date().toLocaleString("en-GB")
    });

    history = history.slice(0, 20);

    localStorage.setItem(
        "nameHistory",
        JSON.stringify(history)
    );

    renderHistory();
}

// Displays the history of past generations on the page
function renderHistory() {

    const container =
        document.getElementById(
            "historyContainer"
        );

    const history =
        JSON.parse(
            localStorage.getItem(
                "nameHistory"
            )
        ) || [];

    if (!history.length) {

        container.innerHTML =
            "<p>No names generated yet.</p>";

        return;
    }

    container.innerHTML =
        history.map(item => `
            <div class="history-item">

                <div class="history-date">
                    ${item.timestamp}
                </div>

                <div class="history-row">

                    <input
                        type="text"
                        readonly
                        value="${item.name}"
                    >

                    <button
                        class="copy-btn-history" onclick="copyHistoryItem('${item.name}')"
                    >
                        Copy
                    </button>

                    <button
                            class="delete-btn"
                            onclick="deleteHistoryItem('${item.id}')"
                        >
                            Delete
                    </button>

                </div>

            </div>
        `).join("");
}

// Copies generated strings from the user to clipboard
function copyHistoryItem(text) {

    navigator.clipboard.writeText(text);

    document.getElementById("success").textContent =
        "Copied from history.";
}

function deleteHistoryItem(id) {

    let history =
        JSON.parse(
            localStorage.getItem("nameHistory")
        ) || [];

    history =
        history.filter(
            item => item.id !== id
        );

    localStorage.setItem(
        "nameHistory",
        JSON.stringify(history)
    );

    renderHistory();

    document.getElementById("success").textContent =
        "History item deleted.";
}

// Deletes every item in local history storge
function clearHistory() {

    localStorage.removeItem(
        "nameHistory"
    );

    renderHistory();

    document.getElementById("success").textContent =
        "History cleared.";
}

[
    "campaignName",
    "bookingId"
].forEach(id => {

    document
        .getElementById(id)
        .addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/[^\w\s]/g, "_")
                        .replace(/\s+/g, "_")
                        .replace(/_+/g, "_");

            }
        );

});

renderHistory();

</script>
